<script>
/* ===================== DURUM ===================== */
var META = { davaTurleri: [], asamalar: [], gelirKategori: [], giderKategori: [], odemeYontemi: [] };
var CASES = [];
var TX = [];

/* ===================== YARDIMCI ===================== */
function $(id){ return document.getElementById(id); }
function fmtMoney(n){
  n = Number(n) || 0;
  return n.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₺';
}
function esc(s){ return ('' + (s==null?'':s)).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function showLoader(b){ $('loader').classList.toggle('show', b); }
function toast(msg, type){
  var t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (type||'');
  setTimeout(function(){ t.className = 'toast'; }, 2600);
}
function fillSelect(el, items, keepFirst){
  var first = keepFirst ? el.options[0].outerHTML : '';
  el.innerHTML = first + items.map(function(i){ return '<option value="'+esc(i)+'">'+esc(i)+'</option>'; }).join('');
}

/* ===================== SEKMELER ===================== */
document.querySelectorAll('.tab').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    $('tab-' + btn.dataset.tab).classList.add('active');
  });
});

/* ===================== BAŞLATMA ===================== */
window.addEventListener('load', function(){
  showLoader(true);
  google.script.run.withSuccessHandler(function(meta){
    META = meta;
    $('sheetLink').href = meta.spreadsheetUrl;
    fillSelect($('c_DavaTuru'), meta.davaTurleri);
    fillSelect($('c_Asama'), meta.asamalar);
    fillSelect($('t_OdemeYontemi'), meta.odemeYontemi);
    fillSelect($('dosyaTurFilter'), meta.davaTurleri, true);
    fillSelect($('dosyaAsamaFilter'), meta.asamalar, true);
    onTxTurChange();
    loadAll();
  }).withFailureHandler(function(e){ showLoader(false); toast('Başlatma hatası: '+e.message,'err'); })
    .getMeta();
});

function loadAll(){
  showLoader(true);
  google.script.run.withSuccessHandler(function(data){
    CASES = data.cases; TX = data.tx;
    refreshCaseDosyaSelect();
    renderCases(); renderTx(); renderDashboard(data.dash);
    showLoader(false);
  }).withFailureHandler(function(e){ showLoader(false); toast('Yükleme hatası: '+e.message,'err'); })
    .bootstrapData();
}

/* ===================== ÖZET (DASHBOARD) ===================== */
function renderDashboard(d){
  $('statCards').innerHTML = [
    card('Toplam Dosya', d.toplamDosya, 'blue'),
    card('Açık Dosya', d.acikDosya, 'amber'),
    card('Toplam Gelir', fmtMoney(d.toplamGelir), 'green'),
    card('Toplam Gider', fmtMoney(d.toplamGider), 'red'),
    card('Net Kâr', fmtMoney(d.netKar), d.netKar>=0?'green':'red'),
    card('Toplam Alacak', fmtMoney(d.toplamAlacak), 'blue')
  ].join('');
  $('turDagilim').innerHTML = barList(d.turDagilim);
  $('asamaDagilim').innerHTML = barList(d.asamaDagilim);
  var tb = $('sonIslemlerTable').querySelector('tbody');
  tb.innerHTML = (d.sonIslemler||[]).map(function(t){
    var gider = ('' + t.Tur).toLowerCase().indexOf('gider') !== -1;
    return '<tr><td>'+esc(t.Tarih)+'</td><td>'+esc(t.DosyaNo||'—')+'</td>'+
      '<td><span class="pill '+(gider?'pill-gider':'pill-gelir')+'">'+esc(t.Tur)+'</span></td>'+
      '<td>'+esc(t.Kategori)+'</td><td class="num '+(gider?'neg':'pos')+'">'+(gider?'-':'+')+fmtMoney(t.Tutar)+'</td></tr>';
  }).join('') || '<tr><td colspan="5" class="empty">Kayıt yok</td></tr>';
}
function card(label, value, cls){
  return '<div class="stat-card '+(cls||'')+'"><div class="label">'+esc(label)+'</div><div class="value">'+esc(value)+'</div></div>';
}
function barList(obj){
  var entries = Object.keys(obj).map(function(k){ return [k, obj[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
  if(!entries.length) return '<div class="empty">Veri yok</div>';
  var max = Math.max.apply(null, entries.map(function(e){ return e[1]; }));
  return entries.map(function(e){
    var pct = max ? Math.round(e[1]/max*100) : 0;
    return '<div class="bar-row"><div class="bar-top"><span>'+esc(e[0])+'</span><b>'+e[1]+'</b></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div></div>';
  }).join('');
}

/* ===================== DOSYALAR ===================== */
['dosyaSearch','dosyaTurFilter','dosyaAsamaFilter'].forEach(function(id){
  document.addEventListener('input', function(e){ if(e.target.id===id) renderCases(); });
});
function asamaClass(a){ if(a==='Kapandı') return 'kapali'; if(a==='Reddedildi') return 'red'; return ''; }
function renderCases(){
  var q = ($('dosyaSearch').value||'').toLowerCase();
  var tf = $('dosyaTurFilter').value, af = $('dosyaAsamaFilter').value;
  var rows = CASES.filter(function(c){
    var hay = (c.DosyaNo+' '+c.MuvekkilAd+' '+c.Telefon+' '+c.TC+' '+c.KarsiTaraf).toLowerCase();
    return (!q||hay.indexOf(q)!==-1) && (!tf||c.DavaTuru===tf) && (!af||c.Asama===af);
  });
  var tb = $('dosyaTable').querySelector('tbody');
  $('dosyaEmpty').classList.toggle('hidden', rows.length>0);
  tb.innerHTML = rows.map(function(c){
    var net = Number(c.NetKar)||0;
    return '<tr onclick="showDetail(\''+esc(c.DosyaNo)+'\')">'+
      '<td><b>'+esc(c.DosyaNo)+'</b></td>'+
      '<td>'+esc(c.MuvekkilAd)+'<div style="color:#6b7280;font-size:11px">'+esc(c.Telefon||'')+'</div></td>'+
      '<td><span class="pill pill-tur">'+esc(c.DavaTuru||'—')+'</span></td>'+
      '<td><span class="pill pill-asama '+asamaClass(c.Asama)+'">'+esc(c.Asama||'—')+'</span></td>'+
      '<td class="num">'+fmtMoney(c.AnlasilanUcret)+'</td>'+
      '<td class="num pos">'+fmtMoney(c.TahsilEdilen)+'</td>'+
      '<td class="num">'+fmtMoney(c.KalanBakiye)+'</td>'+
      '<td class="num '+(net>=0?'pos':'neg')+'">'+fmtMoney(net)+'</td>'+
      '<td onclick="event.stopPropagation()">'+
        '<button class="icon-btn" title="Düzenle" onclick="openCaseModal(\''+esc(c.DosyaNo)+'\')">✏️</button>'+
        '<button class="icon-btn" title="Sil" onclick="removeCase(\''+esc(c.DosyaNo)+'\')">🗑️</button>'+
      '</td></tr>';
  }).join('');
}

function openCaseModal(dosyaNo){
  var c = dosyaNo ? CASES.filter(function(x){ return x.DosyaNo===dosyaNo; })[0] : null;
  $('caseModalTitle').textContent = c ? ('Dosya Düzenle — '+dosyaNo) : 'Yeni Dosya';
  $('c_DosyaNo').value = c ? c.DosyaNo : '';
  $('c_MuvekkilAd').value = c ? c.MuvekkilAd : '';
  $('c_Telefon').value = c ? c.Telefon : '';
  $('c_TC').value = c ? c.TC : '';
  $('c_AcilisTarihi').value = c && c.AcilisTarihi ? c.AcilisTarihi : todayStr();
  $('c_DavaTuru').value = c ? c.DavaTuru : (META.davaTurleri[0]||'');
  $('c_Asama').value = c ? c.Asama : (META.asamalar[0]||'');
  $('c_KarsiTaraf').value = c ? c.KarsiTaraf : '';
  $('c_TazminatTalebi').value = c ? c.TazminatTalebi : '';
  $('c_AnlasilanUcret').value = c ? c.AnlasilanUcret : '';
  $('c_Aciklama').value = c ? c.Aciklama : '';
  openModal('caseModal');
}
function saveCase(){
  var ad = $('c_MuvekkilAd').value.trim();
  if(!ad){ toast('Müvekkil adı zorunlu','err'); return; }
  var payload = {
    DosyaNo: $('c_DosyaNo').value, MuvekkilAd: ad, Telefon: $('c_Telefon').value,
    TC: $('c_TC').value, AcilisTarihi: $('c_AcilisTarihi').value, DavaTuru: $('c_DavaTuru').value,
    Asama: $('c_Asama').value, KarsiTaraf: $('c_KarsiTaraf').value,
    TazminatTalebi: $('c_TazminatTalebi').value, AnlasilanUcret: $('c_AnlasilanUcret').value,
    Aciklama: $('c_Aciklama').value
  };
  var isEdit = !!payload.DosyaNo;
  $('caseSaveBtn').disabled = true; showLoader(true);
  google.script.run.withSuccessHandler(function(res){
    $('caseSaveBtn').disabled = false;
    if(res.ok){ closeModal('caseModal'); toast('Dosya kaydedildi','ok'); loadAll(); }
    else { showLoader(false); toast(res.error||'Hata','err'); }
  }).withFailureHandler(function(e){ $('caseSaveBtn').disabled=false; showLoader(false); toast('Hata: '+e.message,'err'); })
   [isEdit?'updateCase':'addCase'](payload);
}
function removeCase(dosyaNo){
  if(!confirm(dosyaNo+' dosyasını silmek istediğinize emin misiniz? Bu işlem geri alınamaz.')) return;
  showLoader(true);
  google.script.run.withSuccessHandler(function(res){
    if(res.ok){ toast('Dosya silindi','ok'); loadAll(); } else { showLoader(false); toast(res.error,'err'); }
  }).withFailureHandler(function(e){ showLoader(false); toast('Hata: '+e.message,'err'); }).deleteCase(dosyaNo);
}

function showDetail(dosyaNo){
  var c = CASES.filter(function(x){ return x.DosyaNo===dosyaNo; })[0];
  if(!c) return;
  var related = TX.filter(function(t){ return ''+t.DosyaNo===''+dosyaNo; });
  $('detailTitle').textContent = c.DosyaNo + ' — ' + c.MuvekkilAd;
  var net = Number(c.NetKar)||0;
  var info = [
    ['Müvekkil', c.MuvekkilAd], ['Telefon', c.Telefon], ['TC', c.TC],
    ['Dava Türü', c.DavaTuru], ['Aşama', c.Asama], ['Karşı Taraf', c.KarsiTaraf],
    ['Açılış', c.AcilisTarihi], ['Tazminat Talebi', fmtMoney(c.TazminatTalebi)],
    ['Son Güncelleme', c.SonGuncelleme]
  ].map(function(p){ return '<div class="di"><div class="k">'+esc(p[0])+'</div><div class="v">'+esc(p[1]||'—')+'</div></div>'; }).join('');
  var fin = '<div class="detail-fin">'+
    finBox('Anlaşılan', fmtMoney(c.AnlasilanUcret)) +
    finBox('Tahsil Edilen', fmtMoney(c.TahsilEdilen)) +
    finBox('Kalan Bakiye', fmtMoney(c.KalanBakiye)) +
    finBox('Net Kâr', fmtMoney(net)) + '</div>';
  var txRows = related.map(function(t){
    var gider = (''+t.Tur).toLowerCase().indexOf('gider')!==-1;
    return '<tr><td>'+esc(t.Tarih)+'</td><td><span class="pill '+(gider?'pill-gider':'pill-gelir')+'">'+esc(t.Tur)+'</span></td>'+
      '<td>'+esc(t.Kategori)+'</td><td class="num '+(gider?'neg':'pos')+'">'+(gider?'-':'+')+fmtMoney(t.Tutar)+'</td></tr>';
  }).join('') || '<tr><td colspan="4" class="empty">Bu dosyaya ait hareket yok</td></tr>';
  $('detailBody').innerHTML = fin +
    '<div class="detail-grid">'+info+'</div>'+
    (c.Aciklama ? '<p style="margin-top:14px"><b>Açıklama:</b> '+esc(c.Aciklama)+'</p>' : '') +
    '<h3 style="margin:18px 0 8px;font-size:14px">İlgili Muhasebe Hareketleri</h3>'+
    '<div class="table-wrap"><table><thead><tr><th>Tarih</th><th>Tür</th><th>Kategori</th><th class="num">Tutar</th></tr></thead><tbody>'+txRows+'</tbody></table></div>';
  $('detailEditBtn').onclick = function(){ closeModal('detailModal'); openCaseModal(dosyaNo); };
  openModal('detailModal');
}
function finBox(k,v){ return '<div class="fin-box"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'; }

/* ===================== MUHASEBE ===================== */
['txSearch','txTurFilter'].forEach(function(id){
  document.addEventListener('input', function(e){ if(e.target.id===id) renderTx(); });
});
function refreshCaseDosyaSelect(){
  var sel = $('t_DosyaNo');
  sel.innerHTML = '<option value="">— Genel (dosyasız) —</option>' + CASES.map(function(c){
    return '<option value="'+esc(c.DosyaNo)+'">'+esc(c.DosyaNo)+' — '+esc(c.MuvekkilAd)+'</option>';
  }).join('');
}
function onTxTurChange(){
  var tur = $('t_Tur').value;
  fillSelect($('t_Kategori'), tur==='Gider' ? META.giderKategori : META.gelirKategori);
}
function renderTx(){
  var q = ($('txSearch').value||'').toLowerCase();
  var tf = $('txTurFilter').value;
  var rows = TX.filter(function(t){
    var hay = (t.DosyaNo+' '+t.Kategori+' '+t.Aciklama+' '+t.OdemeYontemi).toLowerCase();
    return (!q||hay.indexOf(q)!==-1) && (!tf||(''+t.Tur)===tf);
  }).slice().reverse();
  // muhasebe kartları
  var g=0, gd=0; TX.forEach(function(t){ var v=Number(t.Tutar)||0;
    if((''+t.Tur).toLowerCase().indexOf('gider')!==-1) gd+=v; else g+=v; });
  $('muhasebeCards').innerHTML = [
    card('Toplam Gelir', fmtMoney(g), 'green'),
    card('Toplam Gider', fmtMoney(gd), 'red'),
    card('Bakiye (Net)', fmtMoney(g-gd), (g-gd)>=0?'green':'red')
  ].join('');
  var tb = $('txTable').querySelector('tbody');
  $('txEmpty').classList.toggle('hidden', rows.length>0);
  tb.innerHTML = rows.map(function(t){
    var gider = (''+t.Tur).toLowerCase().indexOf('gider')!==-1;
    return '<tr><td>'+esc(t.Tarih)+'</td><td>'+esc(t.DosyaNo||'—')+'</td>'+
      '<td><span class="pill '+(gider?'pill-gider':'pill-gelir')+'">'+esc(t.Tur)+'</span></td>'+
      '<td>'+esc(t.Kategori)+'</td><td>'+esc(t.OdemeYontemi||'')+'</td><td>'+esc(t.Aciklama||'')+'</td>'+
      '<td class="num '+(gider?'neg':'pos')+'">'+(gider?'-':'+')+fmtMoney(t.Tutar)+'</td>'+
      '<td><button class="icon-btn" title="Sil" onclick="removeTx(\''+esc(t.IslemID)+'\')">🗑️</button></td></tr>';
  }).join('');
}
function openTxModal(){
  $('t_IslemID').value=''; $('t_Tarih').value=todayStr();
  $('t_Tur').value='Gelir'; onTxTurChange();
  $('t_DosyaNo').value=''; $('t_Tutar').value=''; $('t_OdemeYontemi').value=META.odemeYontemi[0]||'';
  $('t_Aciklama').value='';
  openModal('txModal');
}
function saveTx(){
  var tutar = parseFloat($('t_Tutar').value);
  if(!tutar || tutar<=0){ toast('Geçerli bir tutar girin','err'); return; }
  var payload = {
    Tarih: $('t_Tarih').value, DosyaNo: $('t_DosyaNo').value, Tur: $('t_Tur').value,
    Kategori: $('t_Kategori').value, Tutar: $('t_Tutar').value,
    OdemeYontemi: $('t_OdemeYontemi').value, Aciklama: $('t_Aciklama').value
  };
  $('txSaveBtn').disabled=true; showLoader(true);
  google.script.run.withSuccessHandler(function(res){
    $('txSaveBtn').disabled=false;
    if(res.ok){ closeModal('txModal'); toast('Hareket eklendi','ok'); loadAll(); }
    else { showLoader(false); toast(res.error||'Hata','err'); }
  }).withFailureHandler(function(e){ $('txSaveBtn').disabled=false; showLoader(false); toast('Hata: '+e.message,'err'); })
   .addTransaction(payload);
}
function removeTx(id){
  if(!confirm('Bu muhasebe hareketini silmek istediğinize emin misiniz?')) return;
  showLoader(true);
  google.script.run.withSuccessHandler(function(res){
    if(res.ok){ toast('Hareket silindi','ok'); loadAll(); } else { showLoader(false); toast(res.error,'err'); }
  }).withFailureHandler(function(e){ showLoader(false); toast('Hata: '+e.message,'err'); }).deleteTransaction(id);
}

/* ===================== ÖRNEK VERİ ===================== */
function seedSample(){
  if(!confirm('Deneme için örnek dosyalar ve muhasebe hareketleri eklenecek. Devam edilsin mi?')) return;
  showLoader(true);
  google.script.run.withSuccessHandler(function(res){
    if(res.ok){ toast(res.dosya+' dosya, '+res.hareket+' hareket eklendi','ok'); loadAll(); }
    else { showLoader(false); toast('Hata','err'); }
  }).withFailureHandler(function(e){ showLoader(false); toast('Hata: '+e.message,'err'); }).seedSampleData();
}

/* ===================== MODAL KONTROL ===================== */
function openModal(id){ $(id).classList.add('open'); }
function closeModal(id){ $(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(function(ov){
  ov.addEventListener('click', function(e){ if(e.target===ov) ov.classList.remove('open'); });
});
</script>
