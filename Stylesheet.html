<style>
  :root {
    --bg: #f3f4f6;
    --panel: #ffffff;
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #0f766e;
    --brand-dark: #115e59;
    --accent: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --amber: #d97706;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px;
  }

  /* TOPBAR */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: #fff; padding: 12px 20px; box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 42px; height: 42px; border-radius: 10px; background: rgba(255,255,255,.18);
    display: grid; place-items: center; font-weight: 800; font-size: 18px; letter-spacing: 1px;
  }
  .brand-title { font-weight: 700; font-size: 17px; }
  .brand-sub { font-size: 12px; opacity: .85; }
  .topbar-actions { display: flex; gap: 8px; }

  /* TABS */
  .tabs {
    display: flex; gap: 4px; background: var(--panel); padding: 0 16px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; overflow-x: auto;
  }
  .tab {
    border: none; background: none; padding: 14px 16px; font-size: 14px; cursor: pointer;
    color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 500;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }

  .content { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .tab-panel { display: none; animation: fade .2s ease; }
  .tab-panel.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* CARDS */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 14px; margin-bottom: 18px; }
  .stat-card {
    background: var(--panel); border-radius: 12px; padding: 16px; box-shadow: var(--shadow);
    border-left: 4px solid var(--brand);
  }
  .stat-card .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .stat-card .value { font-size: 22px; font-weight: 700; }
  .stat-card.green { border-left-color: var(--green); }
  .stat-card.red { border-left-color: var(--red); }
  .stat-card.amber { border-left-color: var(--amber); }
  .stat-card.blue { border-left-color: var(--accent); }

  /* PANELS */
  .panel { background: var(--panel); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .panel h3 { margin: 0 0 14px; font-size: 15px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 720px){ .grid-2 { grid-template-columns: 1fr; } }

  .bar-list .bar-row { margin-bottom: 10px; }
  .bar-row .bar-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bar-track { background: var(--line); border-radius: 6px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--brand); border-radius: 6px; }

  /* TOOLBAR */
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search], .toolbar select { flex: 1; min-width: 150px; }
  input, select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff; color: var(--ink);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: var(--brand); }

  /* BUTTONS */
  .primary-btn {
    background: var(--brand); color: #fff; border: none; padding: 9px 16px; border-radius: 8px;
    font-size: 14px; cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .primary-btn:hover { background: var(--brand-dark); }
  .ghost-btn {
    background: rgba(255,255,255,.15); color: inherit; border: 1px solid rgba(0,0,0,.08);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tabs ~ .content .ghost-btn, .modal-foot .ghost-btn { background: #f3f4f6; color: var(--ink); }
  .ghost-btn:hover { filter: brightness(.97); }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 4px 6px; border-radius: 6px; }
  .icon-btn:hover { background: var(--line); }

  /* TABLE */
  .table-wrap { overflow-x: auto; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { background: #f9fafb; color: var(--muted); font-weight: 600; position: sticky; top: 0; }
  tbody tr:hover { background: #f9fafb; cursor: pointer; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pos { color: var(--green); font-weight: 600; }
  .neg { color: var(--red); font-weight: 600; }

  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill-tur { background: #ecfeff; color: #0e7490; }
  .pill-asama { background: #eef2ff; color: #4338ca; }
  .pill-asama.kapali { background: #f3f4f6; color: #6b7280; }
  .pill-asama.red { background: #fef2f2; color: #b91c1c; }
  .pill-gelir { background: #ecfdf5; color: #047857; }
  .pill-gider { background: #fef2f2; color: #b91c1c; }

  .empty { text-align: center; color: var(--muted); padding: 40px; }
  .hidden { display: none !important; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(17,24,39,.55); display: none;
    align-items: flex-start; justify-content: center; padding: 30px 16px; z-index: 50; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 640px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { margin: 0; font-size: 16px; }
  .close-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); }
  .modal-body { padding: 20px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--line); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px){ .form-grid { grid-template-columns: 1fr; } }
  label { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 5px; }
  label input, label select, label textarea { font-weight: 400; color: var(--ink); }
  label.full { display: block; margin-top: 14px; }
  label.full textarea, label.full > * { margin-top: 5px; }

  /* DETAIL */
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
  .detail-grid .di { font-size: 13px; }
  .detail-grid .di .k { color: var(--muted); font-size: 11px; }
  .detail-grid .di .v { font-weight: 600; }
  .detail-fin { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
  .detail-fin .fin-box { flex: 1; min-width: 110px; background: #f9fafb; border-radius: 10px; padding: 12px; text-align: center; }
  .detail-fin .fin-box .k { font-size: 11px; color: var(--muted); }
  .detail-fin .fin-box .v { font-size: 17px; font-weight: 700; }

  /* TOAST + LOADER */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #111827; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; transition: .3s; z-index: 100; max-width: 90%;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.ok { background: #065f46; } .toast.err { background: #991b1b; }
  .loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,.6); display: none; place-items: center; z-index: 60; }
  .loader-overlay.show { display: grid; }
  .spinner { width: 38px; height: 38px; border: 4px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
